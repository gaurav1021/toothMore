<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Add some subtle gradients to give the dragon depth while keeping the flat vector look -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2f3b"/>
      <stop offset="40%" stop-color="#1d1e26"/>
      <stop offset="100%" stop-color="#0f1015"/>
    </linearGradient>

    <linearGradient id="leftWingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3d4d"/>
      <stop offset="70%" stop-color="#1d1e26"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>

    <linearGradient id="rightWingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <filter id="wingShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-5" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- BACKGROUND WING: Placed first so it renders behind the body -->
  <g class="right-wing" fill="#111216">

    <!-- Main Right Wing Webbing -->
    <path d="M 430 280 
             C 450 150, 410 80, 520 40 
             C 600 10, 720 40, 780 70 
             C 740 100, 680 110, 650 140 
             C 710 160, 740 190, 720 220 
             C 670 220, 600 240, 550 250 
             C 510 270, 480 290, 430 280 Z" 
          fill="url(#rightWingGrad)"/>

    <!-- Right Wing Bone Structure -->
    <path d="M 430 280 C 470 170, 500 70, 780 70"
          stroke="#050507"
          stroke-width="6"
          fill="none"
          stroke-linecap="round"/>

    <path d="M 525 65 C 550 90, 600 120, 650 140"
          stroke="#050507"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"/>

    <path d="M 480 180 C 530 200, 650 200, 720 220"
          stroke="#050507"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"/>
  </g>

  <!-- Tail -->
  <g class="tail">
    <path d="M 450 280 
             C 600 280, 750 350, 920 340 
             C 800 380, 650 350, 450 340 Z" 
          fill="url(#bodyGrad)"/>

    <path d="M 500 292 L 515 282 L 530 296 
             M 580 306 L 595 296 L 610 312 
             M 660 322 L 675 312 L 690 328
             M 740 335 L 755 325 L 770 339" 
          stroke="none"
          fill="#111217"/>

    <path d="M 850 345 
             C 880 310, 920 280, 960 290 
             C 920 320, 890 350, 850 345 Z"
          fill="#181920"/>

    <path d="M 850 345 
             C 880 320, 910 300, 960 290"
          stroke="#0a0a0d"
          stroke-width="2"
          fill="none"/>

    <path d="M 855 348 
             C 890 380, 940 410, 970 390 
             C 930 365, 890 345, 855 348 Z"
          fill="#b82727"/>

    <path d="M 855 348 
             C 890 365, 930 380, 970 390"
          stroke="#3b0c0c"
          stroke-width="2"
          fill="none"/>

    <path d="M 870 347 L 880 380 
             M 895 344 L 920 390 
             M 920 338 L 950 385"
          stroke="#111217"
          stroke-width="2"
          fill="none"/>
  </g>
  <!-- <g class="tail-base">
  <path d="M 500 320 
           C 650 320, 800 360, 950 340 
           C 900 370, 750 400, 500 380 Z"
        fill="url(#bodyGrad)"/>
</g>

<g class="tail-mid">
  <path d="M 500 320 
           C 650 320, 800 360, 950 340 
           C 900 370, 750 400, 500 380 Z"
        fill="url(#bodyGrad)"/>
</g>

<g class="tail-tip">
  <path d="M 500 320 
           C 650 320, 800 360, 950 340 
           C 900 370, 750 400, 500 380 Z"
        fill="url(#bodyGrad)"/>
</g> -->

  <!-- Neck -->
  <g class="neck">
    <path d="M 140 185 
             C 130 150, 170 120, 185 110 
             C 175 140, 160 170, 145 190 Z"
          fill="#181920"/>

    <path d="M 140 195 
             C 110 170, 120 150, 140 145 
             C 145 165, 145 180, 145 195 Z"
          fill="#181920"/>

    <path d="M 145 230 
             C 125 225, 125 210, 135 205 
             C 145 215, 150 220, 155 230 Z"
          fill="#181920"/>
          <g class="fire"></g>
  </g>

  <!-- DRAGON BODY: Middle layer -->
  <g class="body">

    <!-- Main Torso & Legs -->
    <path d="M 320 280 
             C 400 250, 480 270, 520 300 
             C 450 370, 320 380, 250 330 
             C 200 290, 150 300, 105 255 
             C 120 255, 130 240, 140 235 
             C 130 235, 90 215, 80 205 
             C 100 180, 120 180, 150 180 
             C 180 180, 220 220, 260 250 
             C 280 265, 300 270, 320 280 Z" 
          fill="url(#bodyGrad)"/>

    <!-- Teeth -->
    <path d="M 85 208 L 88 220 L 95 212 Z 
             M 95 212 L 100 223 L 105 216 Z 
             M 105 216 L 112 227 L 118 221 Z 
             M 118 221 L 125 230 L 130 226 Z"
          fill="#e8e8e8"/>

    <path d="M 110 252 L 115 240 L 120 247 Z 
             M 120 247 L 125 235 L 130 242 Z 
             M 130 242 L 133 234 L 137 238 Z"
          fill="#e8e8e8"/>

    <!-- Hind Leg (tucked for flight) -->
    <path d="M 280 320 
             C 250 360, 280 400, 320 400 
             C 340 370, 320 320, 280 320 Z"
          fill="url(#bodyGrad)"/>

    <path d="M 310 398 
             C 320 415, 335 405, 320 400 Z"
          fill="#000"/>

    <!-- Front Leg (tucked for flight) -->
    <path d="M 450 330 
             C 430 380, 480 400, 510 390 
             C 510 360, 480 330, 450 330 Z"
          fill="#14151a"/>

    <path d="M 500 392 
             C 515 405, 525 395, 510 390 Z"
          fill="#000"/>

    <!-- Body Spikes -->
    <path d="M 240 230 L 250 215 L 265 240 
             M 290 255 L 300 240 L 315 265 
             M 350 272 L 360 255 L 375 280 
             M 410 278 L 420 262 L 435 285"
          stroke="none"
          fill="#111217"/>

    <!-- Eye -->
    <g transform="rotate(12 115 210)">
      <ellipse cx="115" cy="210" rx="10" ry="16" fill="#88ff00"/>
      <ellipse cx="115" cy="210" rx="8" ry="14" fill="#aaff55"/>
      <ellipse cx="115" cy="210" rx="2" ry="12" fill="#050505"/>
      <circle cx="112" cy="202" r="2" fill="#ffffff" opacity="0.8"/>
    </g>

  </g>

  <!-- FOREGROUND WING: Placed last so it renders in front of the body -->
  <g class="left-wing" fill="url(#leftWingGrad)" filter="url(#wingShadow)">

    <!-- Main Left Wing Webbing -->
    <path d="M 370 290 
             C 320 120, 200 0, 310 -30 
             C 450 -60, 600 10, 680 40 
             C 610 70, 540 100, 510 130 
             C 580 150, 620 190, 600 220 
             C 530 210, 480 240, 450 270 
             C 430 280, 400 290, 370 290 Z"/>

    <!-- Left Wing Bone Structure -->
    <path d="M 370 290 C 350 120, 450 10, 680 40"
          stroke="#111217"
          stroke-width="8"
          fill="none"
          stroke-linecap="round"/>

    <path d="M 430 20 C 450 60, 480 100, 510 130"
          stroke="#111217"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"/>

    <path d="M 390 150 C 450 180, 530 200, 600 220"
          stroke="#111217"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"/>

    <path d="M 380 220 C 410 240, 430 260, 450 270"
          stroke="#111217"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"/>

    <circle cx="430" cy="20" r="6" fill="#111217"/>
  </g>
</svg>